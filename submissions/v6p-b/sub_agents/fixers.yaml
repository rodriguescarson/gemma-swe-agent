name: fixers
agent_class: ParallelAgent
description: Three independent fixers, each in its own copy /tmp/wK of the workspace.
sub_agents:
  - config_path: fixer_a.yaml
  - config_path: fixer_b.yaml
  - config_path: fixer_c.yaml
# Tool budget (eval_config max_tool_calls = 70 counts every agent's calls in a task, and the harness cannot cap one agent):
#   setup 1 + locator 8 + 3 fixers x 10 + selector 1 + verifier 14 = 54 <= 70; the locator and every fixer may overshoot by 4 raw calls and the
#   selector and verifier still have their 15 (70 - 1 - (8 + 4) - 3 x 14 = 15).
# The caps live in the helper ledger (skills/swe-tools/scripts/_budget.py); tests/test_v6pb_bundle.py checks the arithmetic and the prompts.
